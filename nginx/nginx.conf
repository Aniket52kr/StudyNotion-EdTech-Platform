events {
    worker_connections 1024;
}

http {
    client_max_body_size 50M;

    upstream frontend {
        server studynotion-frontend:80;
    }

    upstream backend {
        server studynotion-backend:4000;
    }

    # Redirect all HTTP traffic to HTTPS
    server {
        listen 80;
        server_name studynotion.duckdns.org;

        # Optional: allow Let's Encrypt challenge during renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name studynotion.duckdns.org;

        # SSL certificates (mounted from host)
        ssl_certificate /etc/letsencrypt/live/studynotion.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/studynotion.duckdns.org/privkey.pem;

        # Security headers (optional but recommended)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM:DHE+CHACHA20;

        # Frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API routes — note: added trailing slash for consistency
        location /api/ {
            proxy_pass http://backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}