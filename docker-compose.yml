version: '3.9'

services:
  backend:
    image: aniket52kr/studynotion-backend:latest
    container_name: studynotion-backend
    restart: unless-stopped
    env_file:
      - ./studynotion-backend/.env 
    ports:
      - "4000:4000"
    networks:
      - studynotion-network


  
  frontend:
    image: aniket52kr/studynotion-frontend:latest
    container_name: studynotion-frontend
    restart: unless-stopped
    networks:
      - studynotion-network


  nginx:
    image: nginx:1.25-alpine
    container_name: studynotion-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - studynotion-network


networks:
  studynotion-network:
    driver: bridge