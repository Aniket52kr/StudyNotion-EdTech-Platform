# version: '3.9'

services:
  backend:
    image: aniket52kr/studynotion-backend:latest
    container_name: studynotion-backend
    restart: unless-stopped
    env_file:
      - ./studynotion-backend/.env
    networks:
      - studynotion-network

  frontend:
    image: aniket52kr/studynotion-frontend:latest
    container_name: studynotion-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - studynotion-network
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot

networks:
  studynotion-network:
    driver: bridge














