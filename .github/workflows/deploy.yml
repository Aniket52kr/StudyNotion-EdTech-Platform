name: CI/CD Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./studynotion-backend
          push: true
          tags: aniket52kr/studynotion-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./studynotion-frontend
          push: true
          tags: aniket52kr/studynotion-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Docker access (debug)
        run: |
          echo "User: $(whoami)"
          echo "Groups: $(groups)"
          docker version

      - name: Pull latest Docker images
        run: |
          docker pull aniket52kr/studynotion-backend:latest
          docker pull aniket52kr/studynotion-frontend:latest

      - name: Sync code to deployment directory
        run: |
          DEPLOY_DIR="/home/ubuntu/studynotion-deploy"
          mkdir -p "$DEPLOY_DIR"

          # Copy everything from repo (except heavy folders)
          rsync -av \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.env.local' \
            "$GITHUB_WORKSPACE"/ "$DEPLOY_DIR"/

      - name: Ensure backend env file exists
        run: |
          ENV_FILE="/home/ubuntu/studynotion-deploy/studynotion-backend.env"
          if [ ! -f "$ENVFILE" ]; then
            echo "ERROR: Backend env file missing at $ENV_FILE"
            echo "You must create it manually on EC2 with your secrets."
            exit 1
          fi
          echo "Found backend env file"

      - name: Deploy with Docker Compose
        working-directory: /home/ubuntu/studynotion-deploy
        run: |
          # Use docker-compose.yml from repo (must use 'image:', not 'build:')
          docker compose down --remove-orphans 2>/dev/null || true
          docker compose up -d --remove-orphans

      - name: Verify deployment
        run: |
          sleep 5
          docker ps --filter "name=studynotion"