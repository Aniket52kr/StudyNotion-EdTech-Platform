name: CI/CD Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./studynotion-backend
          push: true
          tags: aniket52kr/studynotion-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./studynotion-frontend
          push: true
          tags: aniket52kr/studynotion-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, linux]  # Matches your default runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull latest Docker images
        run: |
          docker pull aniket52kr/studynotion-backend:latest
          docker pull aniket52kr/studynotion-frontend:latest

      - name: Copy prod compose file
        run: cp docker-compose.prod.yml docker-compose.yml

      - name: Deploy with Docker Compose
        working-directory: /home/ubuntu/studynotion-deploy
        run: |
          # Sync repo files into deployment directory
          rsync -av --exclude='.git' --exclude='node_modules' $GITHUB_WORKSPACE/ ./

          # Ensure env file exists (created manually on EC2)
          if [ ! -f studynotion-backend.env ]; then
            echo "ERROR: studynotion-backend.env missing!" >&2
            exit 1
          fi

          # Redeploy
          docker compose down --remove-orphans 2>/dev/null || true
          docker compose up -d --remove-orphans