name: Build and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Build and push backend image
      uses: docker/build-push-action@v5
      with:
        context: ./studynotion-backend
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/studynotion-backend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build and push frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./studynotion-frontend
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/studynotion-frontend:latest
        build-args: |
          REACT_APP_BASE_URL=https://studynotion.duckdns.org/api/v1
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
    - name: Deploy to EC2
      run: |
        cd ~/studynotion

        # Stop existing containers
        docker-compose down
        
        # Pull latest images
        docker-compose pull
        
        # Start services
        docker-compose up -d
        
        # Clean up old images
        docker image prune -f