name: CI/CD Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./studynotion-backend
          push: true
          tags: aniket52kr/studynotion-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./studynotion-frontend
          push: true
          tags: aniket52kr/studynotion-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Docker access
        run: |
          echo "User: $(whoami)"
          echo "Groups: $(groups)"
          docker version

      - name: Pull latest images
        run: |
          docker pull aniket52kr/studynotion-backend:latest
          docker pull aniket52kr/studynotion-frontend:latest

      - name: Ensure backend .env file exists
        run: |
          if [ ! -f studynotion-backend/.env ]; then
            echo "ERROR: studynotion-backend/.env is missing!"
            echo "Create it manually on EC2 at: $(pwd)/studynotion-backend/.env"
            exit 1
          fi

      - name: Deploy with Docker Compose
        run: |
          docker compose down --remove-orphans 2>/dev/null || true
          docker compose up -d --remove-orphans

      - name: Verify containers
        run: |
          sleep 5
          docker ps --filter "name=studynotion"