name: Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Build and push backend
      uses: docker/build-push-action@v3
      with:
        context: ./studynotion-backend
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/studynotion-backend:latest
    
    - name: Build and push frontend
      uses: docker/build-push-action@v3
      with:
        context: ./studynotion-frontend
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/studynotion-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
    - name: Deploy to EC2
      run: |
        ssh -o StrictHostKeyChecking=no ubuntu@studynotion.duckdns.org << 'ENDSSH'
        cd /home/ubuntu/studynotion
        docker-compose pull
        docker-compose up -d --force-recreate
        docker system prune -f
        ENDSSH