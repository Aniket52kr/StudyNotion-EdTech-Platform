name: CI/CD Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./studynotion-backend
          push: true
          tags: aniket52kr/studynotion-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./studynotion-frontend
          push: true
          tags: aniket52kr/studynotion-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, linux, ec2]   # labels of your EC2 runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull latest images
        run: |
          docker pull aniket52kr/studynotion-backend:latest
          docker pull aniket52kr/studynotion-frontend:latest

      - name: Deploy with Docker Compose
        run: |
          docker compose down || docker-compose down || true
          docker compose up -d || docker-compose up -d